<!doctype html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#1769e0">
    <title>Study AI — Aprende ao teu ritmo</title>
    <style>
        :root {
            --blue: #1769e0;
            --blue2: #eaf2ff;
            --ink: #17243b;
            --muted: #65748b;
            --line: #e2e9f3;
            --bg: #f5f8fd;
            --white: #fff;
            --shadow: 0 10px 28px #193b6810;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        button, input, select, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 245px;
            background: white;
            border-right: 1px solid var(--line);
            padding: 24px 14px;
            position: fixed;
            inset: 0 auto 0 0;
            overflow: auto;
            z-index: 5;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 850;
            margin: 0 10px 30px;
        }

        .logo {
            background: linear-gradient(135deg, #1769e0, #58a0ff);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 900;
        }

        .navlabel {
            font-size: 11px;
            letter-spacing: 1.2px;
            color: #91a0b4;
            font-weight: 800;
            padding: 8px 12px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            border: 0;
            background: transparent;
            padding: 12px;
            border-radius: 12px;
            color: #53647d;
            text-align: left;
            margin: 3px 0;
            font-weight: 650;
        }

        .nav:hover,
        .nav.active {
            background: var(--blue2);
            color: var(--blue);
        }

        .nav .ico {
            width: 22px;
            text-align: center;
            font-size: 18px;
        }

        .sidebar-bottom {
            margin-top: 30px;
            padding: 14px;
            border-radius: 14px;
            background: #f2f6fc;
            color: var(--muted);
            font-size: 12px;
        }

        .main {
            margin-left: 245px;
            width: calc(100% - 245px);
            min-width: 0;
        }

        .topbar {
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 34px;
            background: #ffffffd9;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 4;
            backdrop-filter: blur(10px);
        }

        .topbar h2 {
            font-size: 18px;
            margin: 0;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #dceaff;
            color: var(--blue);
            font-weight: 900;
        }

        .content {
            padding: 30px;
            max-width: 1500px;
            margin: auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .eyebrow {
            color: var(--blue);
            font-size: 12px;
            font-weight: 850;
            text-transform: uppercase;
            letter-spacing: 1.1px;
        }

        .h1 {
            font-size: clamp(26px, 3vw, 36px);
            letter-spacing: -.8px;
            line-height: 1.15;
            margin: 8px 0 10px;
        }

        .sub {
            color: var(--muted);
            margin: 0 0 24px;
        }

        .hero {
            background: linear-gradient(120deg, #eaf2ff, #f7faff 60%, #e5f0ff);
            border: 1px solid #d9e7ff;
            border-radius: 22px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
        }

        .hero h1 {
            font-size: clamp(28px, 3vw, 40px);
            line-height: 1.1;
            margin: 9px 0 12px;
            max-width: 620px;
        }

        .hero p {
            color: #526581;
            max-width: 600px;
        }

        .hero-art {
            font-size: 84px;
            padding: 12px;
        }

        .btn {
            border: 0;
            background: var(--blue);
            color: white;
            padding: 11px 16px;
            border-radius: 11px;
            font-weight: 750;
            box-shadow: 0 5px 12px #1769e022;
        }

        .btn:hover {
            filter: brightness(.95);
        }

        .btn.secondary {
            background: white;
            color: var(--blue);
            border: 1px solid #cfe0ff;
            box-shadow: none;
        }

        .btn.ghost {
            background: #f1f5fb;
            color: #44546b;
            box-shadow: none;
        }

        .btn.danger {
            background: #fff0f0;
            color: #c23636;
            box-shadow: none;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin: 22px 0;
        }

        .stat,
        .card,
        .panel {
            background: white;
            border: 1px solid var(--line);
            border-radius: 17px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .stat .num {
            font-size: 29px;
            font-weight: 850;
            margin: 6px 0;
        }

        .muted {
            color: var(--muted);
        }

        .sectionhead {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 15px;
            margin: 28px 0 14px;
        }

        .sectionhead h2 {
            margin: 0;
            font-size: 21px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .subject-card {
            background: white;
            border: 1px solid var(--line);
            border-radius: 17px;
            padding: 18px;
            cursor: pointer;
            transition: .18s;
            min-height: 160px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .subject-card:hover {
            transform: translateY(-3px);
            border-color: #a9c8ff;
        }

        .subject-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subject-icon {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            font-size: 23px;
            flex-shrink: 0;
        }

        .subject-card h3 {
            margin: 0;
            font-size: 16px;
        }

        .subject-card p {
            color: var(--muted);
            font-size: 13px;
            margin: 12px 0;
        }

        .tag {
            display: inline-block;
            background: #f0f4fa;
            border-radius: 99px;
            padding: 4px 9px;
            font-size: 11px;
            color: #5b6a80;
            font-weight: 750;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
            min-width: 0;
        }

        .field label {
            font-size: 13px;
            font-weight: 750;
            color: #52617a;
        }

        .field input,
        .field select,
        .field textarea,
        .search {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d9e2ef;
            background: white;
            border-radius: 10px;
            color: var(--ink);
            outline: none;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus,
        .search:focus {
            border-color: #80aefb;
            box-shadow: 0 0 0 3px #1769e014;
        }

        .filters {
            display: flex;
            gap: 12px;
            align-items: end;
            flex-wrap: wrap;
            background: white;
            border: 1px solid var(--line);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .filters .field {
            margin: 0;
            min-width: 140px;
            flex: 1;
        }

        .periods {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 18px 0;
        }

        .period {
            border: 1px solid var(--line);
            background: white;
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: 750;
            color: #62718a;
        }

        .period.active {
            background: var(--blue);
            color: white;
            border-color: var(--blue);
        }

        .topic-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .topic {
            border: 1px solid var(--line);
            background: white;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .topic .n {
            background: #edf3ff;
            color: var(--blue);
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            font-weight: 850;
            flex-shrink: 0;
        }

        .topic h4 {
            margin: 0 0 4px;
        }

        .topic p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .topic .open {
            margin-left: auto;
            align-self: center;
        }

        .lesson {
            max-width: 900px;
        }

        .lesson h2 {
            margin-top: 26px;
        }

        .lesson p {
            line-height: 1.75;
        }

        .example {
            background: #f0f6ff;
            border-left: 4px solid var(--blue);
            padding: 15px;
            border-radius: 0 12px 12px 0;
            margin: 14px 0;
        }

        .video-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .video-link {
            display: block;
            padding: 15px;
            background: white;
            border: 1px solid var(--line);
            border-radius: 13px;
            text-decoration: none;
            color: var(--ink);
        }

        .video-link b {
            display: block;
            margin-bottom: 4px;
        }

        .video-link span {
            font-size: 12px;
            color: var(--muted);
        }

        .chatbox {
            height: min(58vh, 570px);
            overflow: auto;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: white;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bubble {
            max-width: 82%;
            padding: 13px 15px;
            border-radius: 15px;
            white-space: pre-wrap;
        }

        .bubble.ai {
            background: #f0f5fc;
            align-self
                  </div>
    </aside>

    <main class="main">
        <header class="topbar">
            <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
            <div>
                <div class="eyebrow">A tua plataforma de aprendizagem</div>
                <h1 id="topTitle">Início</h1>
            </div>
        </header>

        <!-- PÁGINA INICIAL -->
        <section class="page active" id="page-inicio">
            <div class="welcome">
                <div>
                    <span class="eyebrow">BEM-VINDO AO STUDY AI</span>
                    <h1 class="h1">Aprende ao teu ritmo.</h1>
                    <p class="sub">Organiza o teu estudo, pratica e acompanha o teu progresso num só lugar.</p>
                    <button class="btn" data-goto="estudar">Começar a estudar →</button>
                </div>
                <div class="welcome-art">📚</div>
            </div>

            <div class="stats-grid" id="homeStats">
                <div class="stat-card">
                    <span class="stat-icon">📖</span>
                    <span class="muted small">Matérias concluídas</span>
                    <strong id="statCompleted">0</strong>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">⏱️</span>
                    <span class="muted small">Minutos de estudo</span>
                    <strong id="statMinutes">0</strong>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">🎯</span>
                    <span class="muted small">Respostas registadas</span>
                    <strong id="statAnswers">0</strong>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">⭐</span>
                    <span class="muted small">Favoritos</span>
                    <strong id="statFavorites">0</strong>
                </div>
            </div>

            <div class="sectionhead">
                <div>
                    <h2>As tuas disciplinas</h2>
                    <p class="muted">Continua a aprender com as matérias do teu ano.</p>
                </div>
                <button class="btn secondary" data-goto="estudar">Ver todas</button>
            </div>
            <div class="subject-grid" id="homeSubjects"></div>

            <div class="sectionhead">
                <div>
                    <h2>O que queres fazer hoje?</h2>
                    <p class="muted">Escolhe uma atividade para começares.</p>
                </div>
            </div>

            <div class="quick-grid">
                <button class="quick-card" data-goto="estudar">
                    <span>📚</span>
                    <b>Estudar matérias</b>
                    <small>Explicações e exemplos</small>
                </button>
                <button class="quick-card" data-goto="exercicios">
                    <span>✍️</span>
                    <b>Fazer exercícios</b>
                    <small>Pratica os teus conhecimentos</small>
                </button>
                <button class="quick-card" data-goto="professor">
                    <span>🤖</span>
                    <b>Falar com o Professor IA</b>
                    <small>Tira dúvidas sobre a matéria</small>
                </button>
                <button class="quick-card" data-goto="progresso">
                    <span>📈</span>
                    <b>Ver progresso</b>
                    <small>Acompanha a tua evolução</small>
                </button>
            </div>
        </section>

        <!-- ESTUDAR -->
        <section class="page" id="page-estudar">
            <div class="page-intro">
                <span class="eyebrow">APRENDER</span>
                <h1 class="h1">Estudar por disciplina</h1>
                <p class="sub">Seleciona o teu ano e escolhe a matéria que queres estudar.</p>
            </div>

            <div class="panel">
                <div class="form-grid">
                    <label>
                        Ano de escolaridade
                        <select id="studyYear"></select>
                    </label>
                    <label id="trackField">
                        Curso do secundário
                        <select id="studyTrack">
                            <option value="Ciencias e Tecnologias">Ciências e Tecnologias</option>
                            <option value="Línguas e Humanidades">Línguas e Humanidades</option>
                            <option value="Ciências Socioeconómicas">Ciências Socioeconómicas</option>
                            <option value="Artes Visuais">Artes Visuais</option>
                        </select>
                    </label>
                </div>
                <label class="search-label">
                    Procurar disciplina
                    <input id="subjectSearch" type="search" placeholder="Ex.: Matemática, Português…">
                </label>
            </div>

            <div class="subject-grid" id="subjectGrid"></div>
        </section>

        <!-- DETALHE DA DISCIPLINA -->
        <section class="page" id="page-disciplina">
            <button class="btn secondary back-btn" data-goto="estudar">← Voltar às disciplinas</button>

            <div class="page-intro">
                <span class="eyebrow" id="subjectYearLabel">8.º ano</span>
                <h1 class="h1" id="subjectTitle">Disciplina</h1>
                <p class="sub" id="subjectDescription"></p>
            </div>

            <div class="actions">
                <button class="btn secondary" id="toggleFavorite">☆ Guardar favorito</button>
            </div>

            <div class="period-tabs" id="periodTabs"></div>

            <div class="panel">
                <div class="sectionhead">
                    <div>
                        <h2>Matérias deste período</h2>
                        <p class="muted">Abre um tópico para consultar a explicação e praticar.</p>
                    </div>
                </div>
                <div id="topicList"></div>
            </div>

            <div class="panel">
                <div class="sectionhead">
                    <div>
                        <h2>Vídeos e recursos de apoio</h2>
                        <p class="muted">Encontra materiais adicionais relacionados com a disciplina.</p>
                    </div>
                </div>
                <div class="video-list" id="subjectVideos"></div>
            </div>
        </section>

        <!-- AULA -->
        <section class="page" id="page-aula">
            <button class="btn secondary back-btn" id="backToSubject">← Voltar à disciplina</button>
            <div class="panel lesson-panel" id="lessonContent"></div>
        </section>

        <!-- PROFESSOR IA -->
        <section class="page" id="page-professor">
            <div class="page-intro">
                <span class="eyebrow">ASSISTENTE DE ESTUDO</span>
                <h1 class="h1">Professor IA</h1>
                <p class="sub">Faz perguntas, pede explicações e solicita ajuda com exercícios.</p>
            </div>

            <div class="notice">
                <b>Importante:</b> para receber respostas reais de inteligência artificial, tens de configurar o endereço do backend nas Definições. A chave da API deve ficar no servidor, nunca neste ficheiro.
            </div>

            <div class="prompt-grid">
                <button class="prompt" data-prompt="Explica-me uma matéria de forma simples, com exemplos.">💡 Explica-me uma matéria</button>
                <button class="prompt" data-prompt="Ajuda-me a resolver um exercício passo a passo, mostrando as contas.">🧮 Resolver um exercício</button>
                <button class="prompt" data-prompt="Faz-me perguntas para testar os meus conhecimentos e corrige as minhas respostas.">🎯 Testar os meus conhecimentos</button>
                <button class="prompt" data-prompt="Ajuda-me a preparar um plano de estudo para um teste.">📅 Preparar um teste</button>
            </div>

            <div class="chat-box">
                <div class="chat-heading">
                    <div class="chat-avatar">🤖</div>
                    <div>
                        <b>Professor IA</b>
                        <p class="muted small" id="aiStatus">A verificar a ligação ao servidor…</p>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="bubble ai">
                        Olá! Sou o Professor IA do Study AI. Posso ajudar-te a compreender matérias, resolver exercícios e preparar testes. Escreve a tua dúvida para começar.
                    </div>
                </div>

                <form id="chatForm" class="chat-form">
                    <textarea id="chatInput" rows="2" placeholder="Escreve a tua pergunta…" required></textarea>
                    <button class="btn" id="chatSend" type="submit">Enviar ↑</button>
                </form>
                <p class="muted small">As respostas reais dependem de um backend funcional e de um serviço de IA configurado.</p>
            </div>
        </section>

        <!-- EXERCÍCIOS -->
        <section class="page" id="page-exercicios">
            <div class="page-intro">
                <span class="eyebrow">PRATICAR</span>
                <h1 class="h1">Exercícios e testes</h1>
                <p class="sub">Treina os teus conhecimentos e regista as tuas respostas.</p>
            </div>

            <div class="panel">
                <div class="form-grid">
                    <label>
                        Ano de escolaridade
                        <select id="exerciseYear"></select>
                    </label>
                    <label>
                        Disciplina
                        <select id="exerciseSubject"></select>
                    </label>
                </div>
                <div class="actions">
                    <button class="btn" id="startExercise">Começar exercícios</button>
                </div>
            </div>

            <div id="exerciseArea"></div>
        </section>

        <!-- PROGRESSO -->
        <section class="page" id="page-progresso">
            <div class="page-intro">
                <span class="eyebrow">A TUA EVOLUÇÃO</span>
                <h1 class="h1">O teu progresso</h1>
                <p class="sub">Consulta as matérias concluídas e a atividade registada neste navegador.</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="muted small">Matérias concluídas</span>
                    <strong id="progressCompleted">0</strong>
                </div>
                <div class="stat-card">
                    <span class="muted small">Minutos de estudo</span>
                    <strong id="progressMinutes">0</strong>
                </div>
                <div class="stat-card">
                    <span class="muted small">Respostas registadas</span>
                    <strong id="progressAnswers">0</strong>
                </div>
                <div class="stat-card">
                    <span class="muted small">Favoritos</span>
                    <strong id="progressFavorites">0</strong>
                </div>
            </div>

            <div class="panel">
                <div class="sectionhead">
                    <div>
                        <h2>Atividade recente</h2>
                        <p class="muted">As atividades são guardadas localmente neste dispositivo.</p>
                    </div>
                </div>
                <div id="activityList"></div>
                <button class="btn secondary" id="resetProgress">Apagar progresso</button>
            </div>
        </section>

        <!-- FAVORITOS -->
        <section class="page" id="page-favoritos">
            <div class="page-intro">
                <span class="eyebrow">GUARDADOS</span>
                <h1 class="h1">Os teus favoritos</h1>
                <p class="sub">Acede rapidamente às disciplinas e matérias que guardaste.</p>
            </div>
            <div id="favoritesList"></div>
        </section>

        <!-- MÚSICA -->
        <section class="page" id="page-musica">
            <div class="page-intro">
                <span class="eyebrow">CONCENTRAÇÃO</span>
                <h1 class="h1">Músicas de estudo</h1>
                <p class="sub">Encontra música para te concentrares enquanto estudas.</p>
            </div>

            <div class="notice">
                Os links abrem serviços externos. A disponibilidade de reprodução e de transferência depende de cada serviço e da licença do conteúdo.
            </div>

            <div class="music-grid">
                <a class="music-card" href="https://www.youtube.com/results?search_query=lofi+study+music+no+copyright" target="_blank" rel="noopener">
                    <span class="music-icon">🎧</span>
                    <b>Lo-fi para estudar</b>
                    <small>Procurar música lo-fi no YouTube</small>
                    <span class="music-link">Abrir música ↗</span>
                </a>

                <a class="music-card" href="https://pixabay.com/music/search/ambient/" target="_blank" rel="noopener">
                    <span class="music-icon">🎹</span>
                    <b>Música ambiente</b>
                    <small>Explorar faixas no Pixabay</small>
                    <span class="music-link">Explorar faixas ↗</span>
                </a>
